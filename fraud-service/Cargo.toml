[package]
name = "fraud-service"
version = "1.0.0"
edition = "2021"
description = "Motor Nativo de Análise de Risco e Antifraude em Rust com SQLite isolado"

[dependencies]
axum = "0.7"
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
